# Synapse configuration
#
# All ${VAR} references are expanded from environment variables.
# Use ${VAR:-default} for optional values with defaults.
#
# Run `bun run setup` for an interactive setup wizard.

forges:
  - name: primary
    type: gitea
    url: https://git.example.com
    token: ${GITEA_TOKEN}
    owner: myorg
    repo: myrepo
  - name: secondary
    type: github
    url: https://github.com
    token: ${GITHUB_TOKEN}
    owner: myuser
    repo: myproject

cis:
  - name: drone-primary
    type: drone
    url: https://ci.example.com
    token: ${CI_TOKEN}
    forge: primary
  - name: gh-actions
    type: github-actions
    url: https://api.github.com
    token: ${GITHUB_TOKEN}
    forge: secondary

beads:
  dir: /path/to/repo
  binary: bd

queue:
  type: file
  dir: ./queue

agents:
  # harness picks what performs the work. The default is opencode.
  #   opencode: runs `opencode run <instruction> --format json`
  #   command:  runs a shell command with the instruction as one argument
  - name: code-agent
    emoji: "🔧"
    harness: opencode
    model: anthropic/claude-opus-5
    dir: /path/to/repo
  - name: test-agent
    emoji: "🧪"
    harness: command
    command: ./scripts/run-tests.sh

webhook:
  # SET THE SECRET before the port faces the internet. An empty secret
  # accepts every payload unverified, and a payload starts an agent.
  # One server serves every forge above. Point each forge's webhook at
  # http://<host>:<port>/webhook/<forge-name>, so "primary" posts to
  # /webhook/primary. With a single forge, any path works.
  port: 8080
  secret: ${WEBHOOK_SECRET:-}

parser:
  type: mention

log:
  level: info
  format: text