<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synapse Brain</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        surface: '#161b22',
        border: '#30363d',
        'text-dim': '#8b949e',
        accent: '#58a6ff',
        agent: {
          code: '#bc8cff',
          test: '#f2cc60',
          review: '#7ee787',
          docs: '#ff7b72',
        }
      }
    }
  }
}
</script>
<style>
  body { background: #0d1117; }
  .node { cursor: pointer; }
  .node:hover circle, .node:hover rect, .node:hover polygon { filter: brightness(1.3); }
</style>
</head>
<body class="bg-[#0d1117] text-[#e6edf3] font-sans overflow-hidden">
<div id="app" class="flex flex-col h-screen">
  <header class="flex items-center gap-3 px-4 py-2 bg-[#161b22] border-b border-[#30363d] flex-shrink-0 flex-wrap">
    <h1 class="text-base font-semibold">Synapse Brain</h1>
    <span class="text-xs text-[#8b949e] ml-auto" id="stats"></span>
    <button class="bg-[#30363d] text-[#e6edf3] border-0 px-3 py-1 rounded cursor-pointer text-xs hover:bg-[#58a6ff] hover:text-[#0d1117]" onclick="fetchData()">Refresh</button>
  </header>
  <div id="toolbar" class="flex gap-2 px-4 py-1.5 bg-[#161b22] border-b border-[#30363d] flex-shrink-0 flex-wrap items-center">
    <button data-filter="all" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-[#58a6ff] text-[#0d1117] border-[#58a6ff]">All</button>
    <button data-filter="open" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]">Open</button>
    <button data-filter="in_progress" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]">In Progress</button>
    <button data-filter="blocked" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]">Blocked</button>
    <button data-filter="closed" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]">Closed</button>
    <button data-filter="epic" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]">Epics</button>
    <button data-filter="queued" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]">Queued</button>
    <button data-filter="active" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]">Active</button>
    <span class="w-px h-5 bg-[#30363d]"></span>
    <div class="flex gap-1 flex-wrap" id="agent-filters"></div>
    <input id="search" type="text" placeholder="Filter by title..." class="bg-[#0d1117] text-[#e6edf3] border border-[#30363d] px-2 py-1 rounded text-[11px] w-40" oninput="applyFilters()">
  </div>
  <div id="canvas-wrap" class="flex-1 relative overflow-hidden">
    <svg id="canvas" class="w-full h-full" style="cursor:grab"></svg>
    <div id="panel" class="absolute top-0 right-0 w-[380px] h-full bg-[#161b22] border-l border-[#30363d] p-4 overflow-y-auto hidden"></div>
    <div id="legend" class="absolute bottom-3 left-3 bg-[#161b22] border border-[#30363d] rounded-md p-2"></div>
    <div id="tooltip" class="absolute hidden bg-[#161b22] border border-[#30363d] rounded-md p-2.5 text-xs pointer-events-none max-w-[340px] z-10"></div>
  </div>
</div>
<script>

const AGENT_COLORS = {
  "code-agent": "#bc8cff",
  "test-agent": "#f2cc60",
  "review-agent": "#7ee787",
  "docs-agent": "#ff7b72",
};
const DEFAULT_AGENT_COLOR = "#8b949e";
const AGENT_EMOJI = {
  "code-agent": "🔧",
  "test-agent": "🧪",
  "review-agent": "👀",
  "docs-agent": "📝",
};

let issues = [];
let queueTasks = [];
let nodes = {};
let edges = [];
let filter = "all";
let activeAgents = new Set();
let searchTerm = "";
let transform = { x: 0, y: 0, k: 1 };
let dragging = null;
let dragStart = null;
let panStart = null;
let selectedId = null;
let selectedIssue = null;

function agentColor(name) { return AGENT_COLORS[name] || DEFAULT_AGENT_COLOR; }
function agentEmoji(name) { return AGENT_EMOJI[name] || "🤖"; }
function isPR(d) { return (d.external_ref || "").startsWith("pr:"); }
function prNum(d) { return isPR(d) ? d.external_ref.replace("pr:", "") : null; }

function extractAgent(issue) {
  for (const label of (issue.labels || [])) {
    if (label.startsWith("agent:")) return label.slice(6);
  }
  const m = issue.title.match(/^\[(\S+)\]/);
  if (m && AGENT_COLORS[m[1]]) return m[1];
  return null;
}

function getQueueTask(issueId) {
  return queueTasks.find(t => t.issue_id === issueId) || null;
}

function nodeColor(d) {
  const qt = getQueueTask(d.id);
  if (qt) {
    if (qt.state === "failed") return "#f85149";
    if (qt.state === "done") return "#238636";
    return agentColor(qt.agent);
  }
  if (d.status === "closed" || d.status === "cancelled") return isPR(d) ? "#238636" : "#8b949e";
  if (isPR(d)) return "#bc8cff";
  if (d.issue_type === "epic") return "#58a6ff";
  const agent = extractAgent(d);
  if (agent) return agentColor(agent);
  if (d.status === "in_progress") return "#d29922";
  if (d.status === "blocked") return "#f85149";
  return "#3fb950";
}

function nodeRadius(d) {
  if (d.issue_type === "epic") return 24;
  if (getQueueTask(d.id)) return 18;
  return isPR(d) ? 14 : 16;
}

function nodeShape(d) {
  const qt = getQueueTask(d.id);
  if (qt && qt.state === "active") return "diamond";
  if (d.issue_type === "epic") return "circle";
  if (isPR(d)) return "square";
  return "circle";
}

async function fetchData() {
  try {
    const [ir, qr] = await Promise.all([fetch("/api/export"), fetch("/api/queue")]);
    issues = await ir.json();
    if (!Array.isArray(issues)) issues = issues.issues || [];
    queueTasks = await qr.json();
    if (!Array.isArray(queueTasks)) queueTasks = [];
  } catch (e) { console.error("fetch failed:", e); return; }
  buildGraph();
  layout();
  render();
  updateStats();
  buildAgentFilters();
}

function buildGraph() {
  nodes = {};
  edges = [];
  const seen = new Set();
  for (const issue of issues) {
    nodes[issue.id] = { ...issue, x: 0, y: 0, vx: 0, vy: 0 };
    for (const dep of (issue.dependencies || [])) {
      const target = dep.depends_on_id || dep.blocker;
      if (target && target !== issue.id) {
        const key = issue.id + "\u2192" + target;
        if (!seen.has(key)) { seen.add(key); edges.push({ from: issue.id, to: target, type: dep.type || "blocks" }); }
      }
    }
    if (issue.parent && issue.parent !== issue.id) {
      const key = issue.parent + "\u2192" + issue.id;
      if (!seen.has(key)) { seen.add(key); edges.push({ from: issue.parent, to: issue.id, type: "parent" }); }
    }
  }
}

function layout() {
  const visible = getVisibleNodes();
  const n = visible.length;
  if (n === 0) return;
  const W = 1400, H = 900;
  for (const id of Object.keys(nodes)) {
    nodes[id].x = (Math.random() - 0.5) * W;
    nodes[id].y = (Math.random() - 0.5) * H;
    nodes[id].vx = 0; nodes[id].vy = 0;
  }
  const visSet = new Set(visible);
  const visEdges = edges.filter(e => visSet.has(e.from) && visSet.has(e.to));
  const iters = Math.min(400, 100 + n * 2);
  for (let i = 0; i < iters; i++) {
    for (let a = 0; a < visible.length; a++) {
      for (let b = a + 1; b < visible.length; b++) {
        const na = nodes[visible[a]], nb = nodes[visible[b]];
        let dx = nb.x - na.x, dy = nb.y - na.y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let f = 12000 / (dist * dist);
        na.vx -= (dx/dist)*f; na.vy -= (dy/dist)*f;
        nb.vx += (dx/dist)*f; nb.vy += (dy/dist)*f;
      }
    }
    for (const e of visEdges) {
      const a = nodes[e.from], b = nodes[e.to];
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 1;
      let f = (dist - 130) * 0.004;
      a.vx += (dx/dist)*f; a.vy += (dy/dist)*f;
      b.vx -= (dx/dist)*f; b.vy -= (dy/dist)*f;
    }
    for (const id of visible) {
      const nd = nodes[id];
      nd.vx -= nd.x * 0.001; nd.vy -= nd.y * 0.001;
      if (nd === dragging) continue;
      nd.vx *= 0.85; nd.vy *= 0.85;
      nd.x += nd.vx; nd.y += nd.vy;
    }
  }
}

function matchesFilter(d) {
  if (filter === "all") return true;
  if (filter === "epic") return d.issue_type === "epic";
  if (filter === "queued") { const qt = getQueueTask(d.id); return qt && qt.state === "pending"; }
  if (filter === "active") { const qt = getQueueTask(d.id); return qt && qt.state === "active"; }
  return d.status === filter;
}

function matchesSearch(d) {
  if (!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  if (d.title.toLowerCase().includes(t)) return true;
  if (d.id.toLowerCase().includes(t)) return true;
  if (d.external_ref && d.external_ref.toLowerCase().includes(t)) return true;
  const agent = extractAgent(d);
  if (agent && agent.toLowerCase().includes(t)) return true;
  return false;
}

function matchesAgent(d) {
  if (activeAgents.size === 0) return true;
  const agent = extractAgent(d);
  if (agent && activeAgents.has(agent)) return true;
  const qt = getQueueTask(d.id);
  if (qt && activeAgents.has(qt.agent)) return true;
  return false;
}

function getVisibleNodes() {
  return Object.keys(nodes).filter(id => {
    const d = nodes[id];
    return matchesFilter(d) && matchesSearch(d) && matchesAgent(d);
  });
}

function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderShape(d, r, fill, stroke) {
  const shape = nodeShape(d);
  if (shape === "square") return `<rect x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" fill="${fill}" ${stroke} rx="4"/>`;
  if (shape === "diamond") { const s = r*1.2; return `<polygon points="0,${-s} ${s},0 0,${s} ${-s},0" fill="${fill}" ${stroke} stroke-width="2"/>`; }
  return `<circle r="${r}" fill="${fill}" ${stroke}/>`;
}

function render() {
  const svg = document.getElementById("canvas");
  const wrap = document.getElementById("canvas-wrap");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  svg.setAttribute("viewBox", `${-W/2} ${-H/2} ${W} ${H}`);
  const visible = new Set(getVisibleNodes());
  let html = `<g transform="translate(${transform.x},${transform.y}) scale(${transform.k})">`;
  for (const e of edges) {
    if (!visible.has(e.from) || !visible.has(e.to)) continue;
    const a = nodes[e.from], b = nodes[e.to];
    const color = e.type === "parent" ? "#30363d" : "#f85149";
    const dash = e.type === "parent" ? "5,5" : "none";
    const op = e.type === "parent" ? "0.5" : "0.7";
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="1.5" stroke-dasharray="${dash}" opacity="${op}"/>`;
  }
  for (const id of visible) {
    const d = nodes[id];
    const r = nodeRadius(d);
    const fill = nodeColor(d);
    const label = d.title.length > 32 ? d.title.slice(0,30) + "\u2026" : d.title;
    let stroke = "";
    if (d.status === "blocked") stroke = 'stroke="#fff" stroke-width="2"';
    else if (id === selectedId) stroke = 'stroke="#58a6ff" stroke-width="3"';
    html += `<g class="node" data-id="${id}" transform="translate(${d.x},${d.y})">`;
    html += renderShape(d, r, fill, stroke);
    const agent = extractAgent(d);
    const qt = getQueueTask(d.id);
    const displayAgent = qt ? qt.agent : agent;
    if (displayAgent) html += `<text y="${-r-6}" text-anchor="middle" font-size="12">${agentEmoji(displayAgent)}</text>`;
    if (isPR(d)) html += `<text y="4" text-anchor="middle" fill="#000" font-size="9" font-weight="bold">#${prNum(d)}</text>`;
    else if (d.issue_type === "epic") html += `<text y="4" text-anchor="middle" fill="#000" font-size="10" font-weight="bold">E</text>`;
    html += `<text y="${r+14}" text-anchor="middle" fill="#8b949e" font-size="10">${esc(label)}</text>`;
    html += `</g>`;
  }
  html += `</g>`;
  svg.innerHTML = html;
  svg.querySelectorAll(".node").forEach(el => {
    el.addEventListener("mousedown", e => onNodeDown(e, el.dataset.id));
    el.addEventListener("dblclick", e => { e.stopPropagation(); openPanel(el.dataset.id); });
    el.addEventListener("mouseenter", e => showTooltip(e, el.dataset.id));
    el.addEventListener("mouseleave", hideTooltip);
    el.addEventListener("click", e => { e.stopPropagation(); selectedId = el.dataset.id; render(); });
  });
}

function onNodeDown(e, id) {
  e.stopPropagation();
  dragging = nodes[id];
  dragStart = { mx: e.clientX, my: e.clientY, nx: dragging.x, ny: dragging.y };
}

function showTooltip(e, id) {
  const d = nodes[id];
  const tip = document.getElementById("tooltip");
  const agent = extractAgent(d);
  const qt = getQueueTask(d.id);
  const displayAgent = qt ? qt.agent : agent;
  const agentLine = displayAgent
    ? `<br>${agentEmoji(displayAgent)} <strong>${esc(displayAgent)}</strong>` +
      (qt ? ` <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-semibold ${qt.state==='done'?'bg-green-600':qt.state==='failed'?'bg-red-600':'bg-yellow-600'} text-white">${qt.state}</span>` : "")
    : "";
  const deps = (d.dependencies || []).length;
  tip.innerHTML = `<strong>${esc(d.title)}</strong><br>
    <span class="text-[#8b949e] text-xs">${esc(id)}<br>
    ${d.status} &middot; P${d.priority} &middot; ${d.issue_type}${deps ? " &middot; "+deps+" deps" : ""}</span>${agentLine}`;
  tip.style.display = "block";
  const rect = document.getElementById("canvas-wrap").getBoundingClientRect();
  tip.style.left = (e.clientX - rect.left + 12) + "px";
  tip.style.top = (e.clientY - rect.top - 10) + "px";
}
function hideTooltip() { document.getElementById("tooltip").style.display = "none"; }

function openPanel(id) {
  selectedId = id;
  selectedIssue = nodes[id];
  renderPanel();
  const panel = document.getElementById("panel");
  panel.classList.remove("hidden");
  render();
}

function renderPanel() {
  const d = selectedIssue;
  if (!d) return;
  const panel = document.getElementById("panel");
  const agent = extractAgent(d);
  const qt = getQueueTask(d.id);
  const displayAgent = qt ? qt.agent : agent;

  let agentHtml = "";
  if (displayAgent) {
    agentHtml = `<div class="mb-3"><label class="text-[11px] text-[#8b949e] block mb-1">Agent</label>
      <div class="text-sm">${agentEmoji(displayAgent)} <strong>${esc(displayAgent)}</strong></div></div>`;
  }

  let queueHtml = "";
  if (qt) {
    const badgeCls = qt.state==='done'?'bg-green-600':qt.state==='failed'?'bg-red-600':'bg-yellow-600';
    queueHtml = `<div class="mt-3 pt-3 border-t border-[#30363d]">
      <h3 class="text-xs text-[#8b949e] mb-2">Queue State</h3>
      <div class="mb-2"><label class="text-[11px] text-[#8b949e] block mb-1">State</label>
        <span class="inline-block px-2 py-0.5 rounded text-[10px] font-semibold ${badgeCls} text-white">${qt.state}</span></div>
      <div class="mb-2"><label class="text-[11px] text-[#8b949e] block mb-1">Task ID</label>
        <div class="text-xs font-mono">${esc(qt.id || "")}</div></div>
      ${qt.claimed_at ? `<div class="mb-2"><label class="text-[11px] text-[#8b949e] block mb-1">Claimed</label><div class="text-xs">${esc(qt.claimed_at)}</div></div>` : ""}
      ${qt.completed_at ? `<div class="mb-2"><label class="text-[11px] text-[#8b949e] block mb-1">Completed</label><div class="text-xs">${esc(qt.completed_at)}</div></div>` : ""}
      ${qt.result ? `<div class="mb-2"><label class="text-[11px] text-[#8b949e] block mb-1">Result</label><div class="text-xs">${esc(qt.result)}</div></div>` : ""}
    </div>`;
  }

  const deps = d.dependencies || [];
  const dependents = issues.filter(i => (i.dependencies || []).some(dep => (dep.depends_on_id || dep.blocker) === id));
  let depsHtml = "";
  if (deps.length || dependents.length) {
    depsHtml = `<div class="mt-3 pt-3 border-t border-[#30363d]">
      <h3 class="text-xs text-[#8b949e] mb-2">Dependencies (${deps.length})</h3>`;
    for (const dep of deps) {
      const target = dep.depends_on_id || dep.blocker;
      depsHtml += `<div class="flex justify-between items-center py-1 text-xs"><span>${esc(target)}</span>
        <button class="bg-[#30363d] border-0 text-[#e6edf3] px-2 py-0.5 rounded text-[10px] cursor-pointer" onclick="navigateTo('${target}')">view</button></div>`;
    }
    depsHtml += `</div><div class="mt-3 pt-3 border-t border-[#30363d]">
      <h3 class="text-xs text-[#8b949e] mb-2">Dependents (${dependents.length})</h3>`;
    for (const dep of dependents) {
      depsHtml += `<div class="flex justify-between items-center py-1 text-xs"><span>${esc(dep.id)}</span>
        <button class="bg-[#30363d] border-0 text-[#e6edf3] px-2 py-0.5 rounded text-[10px] cursor-pointer" onclick="navigateTo('${dep.id}')">view</button></div>`;
    }
    depsHtml += `</div>`;
  }

  panel.innerHTML = `
    <h2 class="text-sm font-semibold mb-2 break-words">${esc(d.title)}</h2>
    <div class="text-xs text-[#8b949e] mb-3">${esc(id)} &middot;
      <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-semibold ${d.issue_type==='epic'?'bg-blue-500':d.issue_type==='bug'?'bg-red-600':'bg-[#30363d]'} text-white">${d.issue_type||'task'}</span>
      &middot; P${d.priority} &middot; ${d.status}</div>
    ${agentHtml}
    <div class="mb-3"><label class="text-[11px] text-[#8b949e] block mb-1">Description</label>
      <div class="text-xs whitespace-pre-wrap">${esc(d.description || "")}</div></div>
    ${queueHtml}
    ${depsHtml}
    <div class="mt-3">
      <button class="bg-[#30363d] border-0 text-[#e6edf3] px-4 py-1.5 rounded cursor-pointer text-xs" onclick="closePanel()">Close</button>
    </div>`;
}

function navigateTo(id) {
  if (nodes[id]) {
    transform.x = -nodes[id].x * transform.k;
    transform.y = -nodes[id].y * transform.k;
    openPanel(id);
  }
}

function closePanel() {
  document.getElementById("panel").classList.add("hidden");
  selectedId = null;
  selectedIssue = null;
  render();
}

function buildAgentFilters() {
  const agents = new Set();
  for (const issue of issues) {
    const a = extractAgent(issue);
    if (a) agents.add(a);
  }
  for (const qt of queueTasks) {
    if (qt.agent) agents.add(qt.agent);
  }
  const container = document.getElementById("agent-filters");
  container.innerHTML = "";
  for (const agent of agents) {
    const btn = document.createElement("button");
    btn.className = `flex items-center gap-1 px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors ${
      activeAgents.has(agent)
        ? "bg-[#58a6ff] text-[#0d1117] border-[#58a6ff]"
        : "bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]"
    }`;
    btn.innerHTML = `<span class="w-2 h-2 rounded-full" style="background:${agentColor(agent)}"></span>${agentEmoji(agent)} ${esc(agent)}`;
    btn.onclick = () => {
      if (activeAgents.has(agent)) activeAgents.delete(agent);
      else activeAgents.add(agent);
      render();
      buildAgentFilters();
    };
    container.appendChild(btn);
  }
}

function updateStats() {
  const total = issues.length;
  const open = issues.filter(i => i.status === "open").length;
  const inprog = issues.filter(i => i.status === "in_progress").length;
  const blocked = issues.filter(i => i.status === "blocked").length;
  const closed = issues.filter(i => i.status === "closed" || i.status === "cancelled").length;
  const queued = queueTasks.filter(t => t.state === "pending").length;
  const active = queueTasks.filter(t => t.state === "active").length;
  const done = queueTasks.filter(t => t.state === "done").length;
  const failed = queueTasks.filter(t => t.state === "failed").length;
  const agents = new Set();
  for (const issue of issues) { const a = extractAgent(issue); if (a) agents.add(a); }
  for (const qt of queueTasks) { if (qt.agent) agents.add(qt.agent); }
  document.getElementById("stats").textContent =
    `${total} issues \u00b7 ${open} open \u00b7 ${inprog} in progress \u00b7 ${blocked} blocked \u00b7 ${closed} closed \u00b7 ${queued} queued \u00b7 ${active} active \u00b7 ${done} done \u00b7 ${failed} failed \u00b7 ${agents.size} agents`;

  const legend = document.getElementById("legend");
  let html = "";
  for (const [agent, color] of Object.entries(AGENT_COLORS)) {
    if (agents.has(agent)) {
      html += `<div class="flex items-center gap-1.5 my-0.5"><span class="w-2.5 h-2.5 rounded-full" style="background:${color}"></span><span class="text-[11px]">${agentEmoji(agent)} ${agent}</span></div>`;
    }
  }
  html += `<div class="flex items-center gap-1.5 my-0.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span><span class="text-[11px]">Epic</span></div>`;
  html += `<div class="flex items-center gap-1.5 my-0.5"><span class="w-2.5 h-2.5 rounded-full bg-green-500"></span><span class="text-[11px]">Open</span></div>`;
  html += `<div class="flex items-center gap-1.5 my-0.5"><span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span><span class="text-[11px]">In Progress</span></div>`;
  html += `<div class="flex items-center gap-1.5 my-0.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span><span class="text-[11px]">Blocked</span></div>`;
  html += `<div class="flex items-center gap-1.5 my-0.5"><span class="w-2.5 h-2.5 border-2 border-[#58a6ff]"></span><span class="text-[11px]">PR</span></div>`;
  html += `<div class="flex items-center gap-1.5 my-0.5"><span class="w-2.5 h-2.5 rounded-full bg-gray-500"></span><span class="text-[11px]">Closed</span></div>`;
  legend.innerHTML = html;
}

function applyFilters() {
  searchTerm = document.getElementById("search").value;
  render();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll("#toolbar button[data-filter]").forEach(b => {
    b.className = `px-2.5 py-1 rounded text-[11px] border cursor-pointer transition-colors ${
      b.dataset.filter === filter
        ? "bg-[#58a6ff] text-[#0d1117] border-[#58a6ff]"
        : "bg-transparent text-[#8b949e] border-[#30363d] hover:border-[#58a6ff]"
    }`;
  });
  render();
}

document.querySelectorAll("#toolbar button[data-filter]").forEach(btn => {
  btn.addEventListener("click", () => setFilter(btn.dataset.filter));
});

const canvas = document.getElementById("canvas");
canvas.addEventListener("mousedown", e => {
  if (dragging) return;
  panStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
});
window.addEventListener("mousemove", e => {
  if (dragging) {
    const dx = (e.clientX - dragStart.mx) / transform.k;
    const dy = (e.clientY - dragStart.my) / transform.k;
    dragging.x = dragStart.nx + dx;
    dragging.y = dragStart.ny + dy;
    dragging.vx = 0; dragging.vy = 0;
    render();
  } else if (panStart) {
    transform.x = e.clientX - panStart.x;
    transform.y = e.clientY - panStart.y;
    render();
  }
});
window.addEventListener("mouseup", () => { dragging = null; panStart = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.08;
  transform.k = Math.max(0.05, Math.min(8, transform.k * factor));
  render();
}, { passive: false });
canvas.addEventListener("dblclick", e => {
  if (e.target === canvas) {
    transform = { x: 0, y: 0, k: 1 };
    render();
  }
});

fetchData();
setInterval(fetchData, 30000);
</script>
